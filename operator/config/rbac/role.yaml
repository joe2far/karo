---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: karo-manager-role
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  - pods
  - services
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - karo.dev
  resources:
  - agenttasks
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - karo.dev
  resources:
  - agenttasks/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - karo.dev
  resources:
  - agentteams
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - karo.dev
  resources:
  - agentteams/finalizers
  verbs:
  - update
- apiGroups:
  - karo.dev
  resources:
  - agentteams/status
  verbs:
  - get
  - patch
  - update
