{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "karo.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "karo.labels" . | nindent 4 }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: karo-manager-role
  labels:
    {{- include "karo.labels" . | nindent 4 }}
rules:
  - apiGroups: ["karo.dev"]
    resources: ["agentteams", "agenttasks"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["karo.dev"]
    resources: ["agentteams/status", "agenttasks/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["karo.dev"]
    resources: ["agentteams/finalizers"]
    verbs: ["update"]
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: karo-manager-rolebinding
  labels:
    {{- include "karo.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: karo-manager-role
subjects:
  - kind: ServiceAccount
    name: {{ include "karo.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
