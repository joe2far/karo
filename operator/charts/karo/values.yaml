controller:
  image:
    repository: ghcr.io/karo/karo-controller
    tag: latest
    pullPolicy: IfNotPresent
  replicas: 1
  leaderElection: true
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

agentRuntime:
  image: ghcr.io/karo/agent-runtime:v2
  pullPolicy: IfNotPresent

# Postgres is the single default backend (tasks/memory/mailbox). Bring your own
# via secretRef, or let the chart deploy a default. Redis is optional and can be
# enabled later for mailbox/memory; it is not required.
backends:
  postgres:
    deploy: false
    secretName: karo-pg
  redis:
    deploy: false      # optional; not the default backend
    secretName: karo-redis

serviceAccount:
  create: true
  name: karo-controller

observability:
  metrics:
    enabled: true
  tracing:
    endpoint: http://otel-collector:4317
