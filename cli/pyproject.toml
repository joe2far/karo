[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "karo"
version = "0.1.0"
description = "KARO CLI — portable agent teams that run locally and graduate to Kubernetes."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "KARO contributors" }]
dependencies = [
    "karo-runtime>=0.1.0",
    "typer>=0.12",
    "rich>=13.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
karo = "karo.cli:app"

[tool.setuptools.packages.find]
include = ["karo*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
