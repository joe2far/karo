[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "karo-runtime"
version = "0.1.0"
description = "Shared KARO runtime: spec models, compiler, canonicalizer, validator, stores, harness adapters, coordinator, exporter."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "KARO contributors" }]
dependencies = [
    "pydantic>=2.6",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
sdk = ["claude-agent-sdk>=0.1.0"]
anthropic = ["anthropic>=0.40"]
# Cluster backends (operator lane). The base package stays lean; these are
# imported lazily so `import karo_runtime` works without them installed.
redis = ["redis>=5.0"]
postgres = ["asyncpg>=0.29"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
include = ["karo_runtime*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
